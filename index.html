<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>mi reproductor :3</title>
</head>
<body>
    <main class="reproductor">
        <img
        id="portada"
        src="images/portada.jpg"
        alt="portada de cancion"
       >
       <h1 id="titulo">ola</h1>
       <p id="artista">mi papá</p>
       <div class="progreso">
        <span id="tiempoActual">0:00</span>

        <input
        type="range"
        id="barraProgreso"
        min="0"
        max="100"
        value="0"
        >
        <span id="duracion">0:00</span>
       </div>
       <div class="controles">
        <button id="anterior">
            💗
        </button>
        <button id="pausa">
            🌺
        </button>
        <button id="siguiente">
            💞
        </button>
       </div>
    
       
       <div class="volumen">
        <input
        type="range"
        id="volumen"
        min="0"
        max="100"
        step="0.01"
        value="1"
        >

       </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
